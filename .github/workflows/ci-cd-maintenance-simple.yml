name: CI/CD Maintenance

on:
  push:
    branches: [ci-cd-maintenance]

permissions:
  contents: read

jobs:
  validate-changes:
    name: Validate CI/CD Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install pyyaml

      - name: Detect and validate changes
        run: |
          echo "Detecting CI/CD changes..."

          # Find changed workflow files
          changed_files=$(git diff --name-only origin/main..HEAD | grep -E '\.(yml|yaml)$' | grep -E '^\.github/' || echo "")

          if [ -z "$changed_files" ]; then
            echo "No CI/CD workflow changes detected"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          # Validate YAML syntax
          echo "Validating YAML syntax..."
          for file in $changed_files; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              python -c "
import yaml
try:
    with open('$file') as f:
        yaml.safe_load(f)
    print('✅ Valid YAML')
except:
    print('❌ Invalid YAML')
    exit(1)
              "
            fi
          done

          echo "✅ All validations passed"
          echo ""
          echo "🚨 MANUAL REVIEW REQUIRED"
          echo "These CI/CD changes need manual review before merge"