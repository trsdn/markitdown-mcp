name: Dependency Review

on:  pull_request:
    paths-ignore:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/analyze-version.py'
      - 'scripts/coverage-diff.py'
      - 'scripts/generate-schemas.py'
      - 'scripts/ci-*.py'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/ci-cd-paths.yml'
  # Also run on Dependabot PRs
  pull_request_target:
    branches-ignore: [ci-cd-maintenance]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        # Fail on high or critical vulnerabilities
        fail-on-severity: high

        # Allow these common open-source licenses
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, GPL-3.0, LGPL-2.1, LGPL-3.0

        # Create a comment on the PR with results
        comment-summary-in-pr: true

        # Show detailed vulnerability information
        vulnerability-check: true

        # Check license compatibility
        license-check: true

    - name: Upload dependency review report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-review-report
        path: dependency-review-report.json
        retention-days: 30