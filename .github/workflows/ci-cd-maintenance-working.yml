name: CI-CD Maintenance Working

on:
  push:
    branches: [ci-cd-maintenance]

permissions:
  contents: read

jobs:
  validate-changes:
    name: Validate CI-CD Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install pyyaml

      - name: Detect changes
        run: |
          echo "Detecting CI/CD changes..."
          git diff --name-only origin/main..HEAD | grep -E '\.(yml|yaml)$' | grep -E '^\.github/' || echo "No workflow changes"

      - name: Validate YAML files
        run: |
          echo "Validating YAML syntax..."
          find .github/workflows -name "*.yml" -type f | head -3 | while read file; do
            echo "Checking: $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" && echo "✅ Valid" || echo "❌ Invalid"
          done

      - name: Summary
        run: |
          echo "✅ Basic validation completed"
          echo "🚨 MANUAL REVIEW REQUIRED for CI/CD changes"