name: CI/CD Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/analyze-version.py'
      - 'scripts/coverage-diff.py'
      - 'scripts/generate-schemas.py'
      - 'scripts/ci-*.py'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/ci-cd-paths.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/analyze-version.py'
      - 'scripts/coverage-diff.py'
      - 'scripts/generate-schemas.py'
      - 'scripts/ci-*.py'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/ci-cd-paths.yml'

permissions:
  contents: read

# Cancel duplicate runs
concurrency:
  group: ci-cd-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          pip install PyYAML yamllint

      - name: Validate YAML syntax
        run: |
          echo "=== Validating workflow YAML syntax ==="
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              python -c "import yaml; yaml.safe_load(open('$file'))" || {
                echo "❌ YAML syntax error in $file"
                exit 1
              }
            fi
          done
          echo "✅ All workflow files have valid YAML syntax"

      - name: Lint workflow files
        run: |
          echo "=== Linting workflow files ==="
          yamllint .github/workflows/ || {
            echo "❌ YAML linting failed"
            exit 1
          }
          echo "✅ All workflow files pass linting"

      - name: Check for security issues
        run: |
          echo "=== Checking for security issues ==="

          # Check for dangerous pull_request_target + checkout combinations
          if grep -r "pull_request_target" .github/workflows/ | grep -v "ref:" | head -5; then
            echo "⚠️  Found pull_request_target usage - ensure it's safe"
            echo "Check that checkout uses explicit ref and doesn't execute untrusted code"
          fi

          # Check for script injections
          if grep -r '\${{.*github\.event\.' .github/workflows/ | grep -v 'github.event.repository' | head -5; then
            echo "⚠️  Found potential script injection patterns"
            echo "Ensure user input is properly sanitized in workflows"
          fi

          # Check for secrets in workflow files
          if grep -ri "password\|secret\|token" .github/workflows/ | grep -v "secrets\." | grep -v "GITHUB_TOKEN" | head -5; then
            echo "⚠️  Found potential hardcoded secrets"
            echo "Ensure no secrets are hardcoded in workflow files"
          fi

          echo "✅ Security checks completed"

      - name: Validate CI/CD paths configuration
        run: |
          echo "=== Validating CI/CD paths configuration ==="
          if [ -f ".github/ci-cd-paths.yml" ]; then
            python -c "import yaml; config = yaml.safe_load(open('.github/ci-cd-paths.yml')); print('CI/CD paths config is valid'); print(f'Total paths: {len(config.get(\"all_paths\", []))}')"
          else
            echo "⚠️  CI/CD paths configuration not found"
          fi

  validate-scripts:
    name: Validate CI/CD Scripts
    runs-on: ubuntu-latest
    if: contains(github.event.*.modified_files, 'scripts/') || contains(github.event.*.added_files, 'scripts/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install script dependencies
        run: |
          pip install --upgrade pip
          # Install common dependencies for CI scripts
          pip install PyYAML requests || true

      - name: Validate Python scripts syntax
        run: |
          echo "=== Validating Python script syntax ==="
          for file in scripts/*.py; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              python -m py_compile "$file" || {
                echo "❌ Python syntax error in $file"
                exit 1
              }
            fi
          done
          echo "✅ All Python scripts have valid syntax"

      - name: Run basic script tests
        run: |
          echo "=== Running basic script tests ==="
          # Test scripts that should have --help
          for script in scripts/analyze-version.py scripts/coverage-diff.py; do
            if [ -f "$script" ]; then
              echo "Testing $script --help"
              python "$script" --help || echo "Script $script doesn't support --help"
            fi
          done

  security-scan:
    name: Security Scan CI/CD Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run action security scan
        run: |
          echo "=== Scanning for action security issues ==="

          # Check for pinned action versions
          echo "Checking for unpinned actions..."
          if grep -r "uses:.*@main\|uses:.*@master" .github/workflows/ | head -5; then
            echo "⚠️  Found unpinned actions using @main or @master"
            echo "Consider pinning to specific versions for security"
          fi

          # Check for third-party actions
          echo "Third-party actions in use:"
          grep -r "uses:" .github/workflows/ | grep -v "actions/" | grep -v "github/" | sort | uniq | head -10

          echo "✅ Security scan completed"

  summary:
    name: CI/CD Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-workflows, validate-scripts, security-scan]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== CI/CD Validation Summary ==="
          echo "Workflow validation: ${{ needs.validate-workflows.result }}"
          echo "Script validation: ${{ needs.validate-scripts.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.validate-workflows.result }}" == "failure" || "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ CI/CD validation failed"
            exit 1
          else
            echo "✅ CI/CD validation passed"
          fi