name: Automated Version Bump

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force version bump even if no significant changes'
        required: false
        default: false
        type: boolean
      bump_type:
        description: 'Override automatic version detection'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      needs-bump: ${{ steps.analysis.outputs.needs-bump }}
      bump-type: ${{ steps.analysis.outputs.bump-type }}
      new-version: ${{ steps.analysis.outputs.new-version }}
      changelog: ${{ steps.analysis.outputs.changelog }}
      commits-count: ${{ steps.analysis.outputs.commits-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Analyze commits since last release
        id: analysis
        run: |
          LATEST_TAG="${{ steps.latest-tag.outputs.latest-tag }}"
          FORCE_BUMP="${{ inputs.force_bump }}"
          OVERRIDE_TYPE="${{ inputs.bump_type }}"

          # Get commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="$LATEST_TAG..HEAD"
          fi

          # Analyze conventional commits
          python -c "
          import subprocess
          import re
          import json
          from datetime import datetime

          # Get commits
          result = subprocess.run(['git', 'log', '--oneline', '--pretty=format:%s', '$COMMIT_RANGE'],
                                capture_output=True, text=True)
          commits = result.stdout.strip().split('\n') if result.stdout.strip() else []

          print(f'Analyzing {len(commits)} commits since $LATEST_TAG')

          # Parse conventional commits
          breaking_changes = []
          features = []
          fixes = []
          other = []

          for commit in commits:
              if not commit.strip():
                  continue

              # Check for breaking changes
              if 'BREAKING CHANGE' in commit.upper():
                  breaking_changes.append(commit)
              elif commit.startswith('feat'):
                  features.append(commit)
              elif commit.startswith('fix'):
                  fixes.append(commit)
              elif commit.startswith(('perf',)):
                  fixes.append(commit)  # Performance improvements are patches
              else:
                  other.append(commit)

          # Determine version bump needed
          if breaking_changes:
              bump_type = 'major'
          elif features:
              bump_type = 'minor'
          elif fixes:
              bump_type = 'patch'
          else:
              bump_type = 'none'

          # Override if manual input provided
          if '$OVERRIDE_TYPE' != 'auto':
              bump_type = '$OVERRIDE_TYPE'

          # Force bump if requested
          if '$FORCE_BUMP' == 'true' and bump_type == 'none':
              bump_type = 'patch'

          # Calculate new version
          current_version = '$LATEST_TAG'.lstrip('v')
          if current_version == '0.0.0':
              new_version = '0.1.0'
          else:
              parts = current_version.split('.')
              major, minor, patch = int(parts[0]), int(parts[1]), int(parts[2])

              if bump_type == 'major':
                  major += 1
                  minor = 0
                  patch = 0
              elif bump_type == 'minor':
                  minor += 1
                  patch = 0
              elif bump_type == 'patch':
                  patch += 1

              new_version = f'{major}.{minor}.{patch}'

          # Generate changelog
          changelog_entries = []

          if breaking_changes:
              changelog_entries.append('### ⚠️ BREAKING CHANGES')
              for commit in breaking_changes[:3]:
                  desc = re.sub(r'^[^:]+:', '', commit).strip()
                  changelog_entries.append(f'- {desc}')
              changelog_entries.append('')

          if features:
              changelog_entries.append('### ✨ Features')
              for commit in features[:5]:
                  desc = re.sub(r'^feat[^:]*:', '', commit).strip()
                  changelog_entries.append(f'- {desc}')
              if len(features) > 5:
                  changelog_entries.append(f'- ... and {len(features) - 5} more features')
              changelog_entries.append('')

          if fixes:
              changelog_entries.append('### 🐛 Bug Fixes')
              for commit in fixes[:5]:
                  desc = re.sub(r'^(fix|perf)[^:]*:', '', commit).strip()
                  changelog_entries.append(f'- {desc}')
              if len(fixes) > 5:
                  changelog_entries.append(f'- ... and {len(fixes) - 5} more fixes')
              changelog_entries.append('')

          changelog = '\n'.join(changelog_entries)

          # Output results
          needs_bump = bump_type != 'none'

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'needs-bump={str(needs_bump).lower()}\n')
              f.write(f'bump-type={bump_type}\n')
              f.write(f'new-version={new_version}\n')
              f.write(f'commits-count={len(commits)}\n')
              f.write(f'changelog<<EOF\n{changelog}\nEOF\n')

          print(f'Analysis complete:')
          print(f'  Needs bump: {needs_bump}')
          print(f'  Bump type: {bump_type}')
          print(f'  New version: {new_version}')
          print(f'  Commits: {len(commits)}')
          print(f'  Breaking: {len(breaking_changes)}')
          print(f'  Features: {len(features)}')
          print(f'  Fixes: {len(fixes)}')
          "

  create-version-bump:
    name: Create Version Bump PR
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-bump == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install tomli_w

      - name: Create version bump branch
        run: |
          NEW_VERSION="${{ needs.analyze-changes.outputs.new-version }}"
          BRANCH_NAME="version-bump/v$NEW_VERSION"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git checkout -b "$BRANCH_NAME"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ needs.analyze-changes.outputs.new-version }}"

          python -c "
          import tomllib
          import tomli_w

          # Read current pyproject.toml
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          # Update version
          data['project']['version'] = '$NEW_VERSION'

          # Write back
          with open('pyproject.toml', 'wb') as f:
              tomli_w.dump(data, f)

          print(f'Updated version to $NEW_VERSION in pyproject.toml')
          "

      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION="${{ needs.analyze-changes.outputs.new-version }}"
          CHANGELOG="${{ needs.analyze-changes.outputs.changelog }}"

          # Create new changelog entry
          cat > new_entry.md << 'EOF'
          ## [$NEW_VERSION] - $(date +%Y-%m-%d)

          $CHANGELOG

          EOF

          # Backup current changelog
          cp CHANGELOG.md CHANGELOG.md.bak

          # Create new changelog
          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to this project will be documented in this file."
            echo ""
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),"
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
            echo ""
            # Add new entry
            envsubst < new_entry.md
            echo ""
            # Add existing content (skip header)
            tail -n +9 CHANGELOG.md.bak
          } > CHANGELOG.md

          # Clean up
          rm new_entry.md CHANGELOG.md.bak

      - name: Commit changes
        run: |
          NEW_VERSION="${{ needs.analyze-changes.outputs.new-version }}"
          BUMP_TYPE="${{ needs.analyze-changes.outputs.bump-type }}"

          git add pyproject.toml CHANGELOG.md

          # Create conventional commit message
          git commit -m "chore: bump version to v$NEW_VERSION

          This $BUMP_TYPE version bump includes:
          - ${{ needs.analyze-changes.outputs.commits-count }} commits since last release
          - Automated changelog generation
          - Version update in pyproject.toml

          Release will be triggered automatically when this PR is merged."

      - name: Push branch and create PR
        run: |
          NEW_VERSION="${{ needs.analyze-changes.outputs.new-version }}"
          BUMP_TYPE="${{ needs.analyze-changes.outputs.bump-type }}"
          BRANCH_NAME="${{ env.branch-name }}"

          # Push branch
          git push origin "$BRANCH_NAME"

          # Create PR description
          cat > pr_body.md << EOF
          ## 🚀 Automated Version Bump: v$NEW_VERSION

          This PR automatically bumps the version based on conventional commits since the last release.

          ### 📊 Release Summary
          - **Version Type**: $BUMP_TYPE
          - **New Version**: v$NEW_VERSION
          - **Commits Included**: ${{ needs.analyze-changes.outputs.commits-count }}
          - **Generated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### 📝 Changelog Preview
          ${{ needs.analyze-changes.outputs.changelog }}

          ### 🎯 What Happens Next
          1. **Review**: Maintainers review this automated version bump
          2. **Merge**: When merged, a git tag \`v$NEW_VERSION\` will be created
          3. **Release**: The tag will trigger the automated release workflow
          4. **Publish**: Package will be published to PyPI automatically

          ### ✅ Pre-Release Checklist
          - [ ] Version number looks correct
          - [ ] Changelog entries are accurate
          - [ ] No breaking changes in patch/minor releases
          - [ ] All CI checks pass

          ---
          *This PR was created automatically by the version bump workflow. The release will be fully automated upon merge.*
          EOF

          # Create PR
          gh pr create \
            --title "chore: bump version to v$NEW_VERSION" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH_NAME" \
            --label "release" \
            --label "automated"

          echo "✅ Version bump PR created successfully!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-tag-on-merge:
    name: Auto-tag on Merge
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'chore: bump version to v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from commit message
        id: version
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'chore: bump version to v\K[0-9]+\.[0-9]+\.[0-9]+' || echo "")

          if [ -z "$VERSION" ]; then
            echo "❌ Could not extract version from commit message"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Extracted version: $VERSION"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create signed tag
          git tag -a "$TAG" -m "Release $TAG

          This release was automatically created from version bump commit.

          See CHANGELOG.md for details of changes included in this release."

          git push origin "$TAG"

          echo "✅ Created and pushed tag: $TAG"

  notify-no-changes:
    name: No Changes Notification
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.needs-bump == 'false' && github.event_name != 'schedule'
    steps:
      - name: Notify no version bump needed
        run: |
          echo "ℹ️ No version bump needed"
          echo "No significant changes found since last release."
          echo "Commits analyzed: ${{ needs.analyze-changes.outputs.commits-count }}"
          echo ""
          echo "To force a version bump, re-run this workflow with 'force_bump' enabled."
