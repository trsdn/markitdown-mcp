name: CI-CD Maintenance

on:
  push:
    branches: [ci-cd-maintenance]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate only, no changes)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-cd-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cicd-changes:
    name: Validate CI/CD Changes
    runs-on: ubuntu-latest
    outputs:
      changes-detected: ${{ steps.detect-changes.outputs.changes-detected }}
      changed-files: ${{ steps.detect-changes.outputs.changed-files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          pip install pyyaml

      - name: Detect CI/CD changes
        id: detect-changes
        run: |
          echo "Detecting CI/CD related changes..."

          # Get changed files compared to main
          changed_files=$(git diff --name-only origin/main..HEAD | grep -E '\.(yml|yaml)$' | grep -E '^\.github/' || true)

          if [ -z "$changed_files" ]; then
            echo "changes-detected=false" >> $GITHUB_OUTPUT
            echo "changed-files=" >> $GITHUB_OUTPUT
            echo "No CI/CD workflow changes detected"
          else
            echo "changes-detected=true" >> $GITHUB_OUTPUT
            echo "changed-files<<EOF" >> $GITHUB_OUTPUT
            echo "$changed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "Changed CI/CD Files:"
            echo "$changed_files"
          fi

      - name: Validate YAML syntax
        if: steps.detect-changes.outputs.changes-detected == 'true'
        run: |
          echo "Validating YAML syntax..."

          # Check each changed workflow file
          echo "${{ steps.detect-changes.outputs.changed-files }}" | while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Validating: $file"
              python -c "
import yaml
import sys
try:
    with open('$file', 'r') as f:
        yaml.safe_load(f)
    print('✅ $file - Valid YAML')
except yaml.YAMLError as e:
    print(f'❌ $file - YAML Error: {e}')
    sys.exit(1)
except Exception as e:
    print(f'❌ $file - Error: {e}')
    sys.exit(1)
              "
            fi
          done

      - name: Security check for workflows
        if: steps.detect-changes.outputs.changes-detected == 'true'
        run: |
          echo "Running security analysis..."

          security_issues=0

          echo "${{ steps.detect-changes.outputs.changed-files }}" | while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Security scanning: $file"

              # Check for shell injection risks (simplified)
              if grep -q 'run:.*\${{' "$file"; then
                if ! grep -q 'github\.' "$file" && ! grep -q 'inputs\.' "$file" && ! grep -q 'secrets\.' "$file"; then
                  echo "⚠️ $file - Potential shell injection risk with user-controlled input"
                  security_issues=$((security_issues + 1))
                fi
              fi

              # Check for secrets usage
              if grep -q 'secrets\.' "$file"; then
                echo "🔍 $file - Uses secrets - verify proper handling"
              fi
            fi
          done

          if [ $security_issues -eq 0 ]; then
            echo "✅ No security issues detected"
          else
            echo "⚠️ $security_issues potential security issues detected"
          fi

      - name: Generate review summary
        if: steps.detect-changes.outputs.changes-detected == 'true'
        run: |
          echo "============================================"
          echo "📋 CI/CD MAINTENANCE REVIEW SUMMARY"
          echo "============================================"
          echo ""
          echo "📁 Changed Files:"
          echo "${{ steps.detect-changes.outputs.changed-files }}" | sed 's/^/  - /'
          echo ""
          echo "✅ Validation Results:"
          echo "  - YAML syntax: PASSED"
          echo "  - Security scan: COMPLETED"
          echo ""
          echo "📋 Manual Review Required:"
          echo "  □ Review all changed workflow files"
          echo "  □ Verify security implications"
          echo "  □ Check for circular dependencies"
          echo "  □ Ensure proper permissions"
          echo ""
          echo "🚨 IMPORTANT: This workflow requires MANUAL MERGE"
          echo "============================================"