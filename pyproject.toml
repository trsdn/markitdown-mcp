[build-system]
requires = [
    "setuptools>=77.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "trsdn-markitdown-mcp"
version = "1.2.3"
description = "An independent Model Context Protocol (MCP) server for converting documents to Markdown using MarkItDown"
authors = [
    { name = "trsdn", email = "noreply@users.noreply.github.com" },
]
maintainers = [
    { name = "trsdn", email = "noreply@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "mcp",
    "markitdown",
    "markdown",
    "document-conversion",
    "model-context-protocol",
    "pdf",
    "docx",
    "ocr",
    "llm",
]
dependencies = [
    "markitdown>=0.1.0",
    "pypdf>=3.17.0",
    "python-pptx>=0.6.21",
    "pillow>=10.0.0",
    "python-magic>=0.4.27",
    "pdf2image>=1.16.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
all = [
    "markitdown[all]>=0.1.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pydub>=0.25.1",
    "speechrecognition>=3.10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "safety>=2.3",
    "tomli_w>=1.0.0",
]
test = [
    "psutil>=5.9",
    "memory_profiler>=0.60",
    "pytest-timeout>=2.1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=1.24",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "pydocstyle>=6.3",
    "interrogate>=1.5",
    "docstr-coverage>=2.3",
    "pdoc>=14.0",
]

[project.urls]
Homepage = "https://github.com/trsdn/markitdown-mcp"
Documentation = "https://github.com/trsdn/markitdown-mcp#readme"
Repository = "https://github.com/trsdn/markitdown-mcp"
Issues = "https://github.com/trsdn/markitdown-mcp/issues"
Changelog = "https://github.com/trsdn/markitdown-mcp/blob/main/CHANGELOG.md"

[project.scripts]
markitdown-mcp = "markitdown_mcp.server:main"
trsdn-markitdown-mcp = "markitdown_mcp.server:main"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "markitdown_mcp*",
]

[tool.setuptools.package-data]
markitdown_mcp = [
    "*.json",
]

[tool.black]
line-length = 100
target-version = [
    "py38",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "TCH",
    "DTZ",
    "ERA",
    "PTH",
    "RSE",
    "RET",
    "RUF",
    "S",
    "N",
    "PIE",
    "PT",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "S101",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "ARG001",
    "PLR2004",
]
"docs/*" = [
    "E402",
    "I001",
]

[tool.ruff.lint.isort]
known-first-party = [
    "markitdown_mcp",
]
combine-as-imports = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "markitdown.*",
    "pypdf.*",
    "PIL.*",
    "pdf2image.*",
    "psutil.*",
    "memory_profiler.*",
]
ignore_missing_imports = true
